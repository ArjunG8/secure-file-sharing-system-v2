name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: securefiles_test
          POSTGRES_USER: ci
          POSTGRES_HOST_AUTH_METHOD: trust  # throwaway CI container; no password needed
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Tests (SQLite)
        run: pytest
      - name: Tests (PostgreSQL)
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ci@localhost:5432/securefiles_test
      - name: Migrations apply to PostgreSQL
        run: alembic upgrade head && alembic downgrade base
        env:
          DATABASE_URL: postgresql+psycopg://ci@localhost:5432/securefiles_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
