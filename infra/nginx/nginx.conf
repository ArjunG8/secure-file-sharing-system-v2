# Owner: M10. STARTING POINT ONLY - M10 must review, harden and test this config
# (cipher suites, CSP for the built frontend, rate limiting, request size limits).
# Not yet verified end-to-end; see docs/security-design.md section M10.

events {}

http {
    server_tokens off;
    client_max_body_size 26m;

    upstream backend  { server backend:8000; }
    upstream frontend { server frontend:5173; }

    # Redirect all plain HTTP to HTTPS.
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;

        # Generated locally by scripts/gen-dev-certs.sh; never committed.
        ssl_certificate     /etc/nginx/certs/dev.crt;
        ssl_certificate_key /etc/nginx/certs/dev.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-TLS-Protocol $ssl_protocol;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            # Vite dev server hot-reload websocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
