# Owner: M10. TLS-terminating reverse proxy for the `tls` Compose profile.
# Serves the PRODUCTION frontend build (static files baked into the image by
# infra/nginx/Dockerfile) and proxies /api to the backend.
# Statically checked by backend/tests/modules/test_transport.py; it has NOT been run end-to-end
# yet (no Docker on the machine where it was written) - see docs/security-design.md M10.

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile on;

    # Matches MAX_UPLOAD_BYTES (25 MiB) plus multipart overhead; larger bodies get 413 here.
    client_max_body_size 26m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    # Per-client-IP limit in front of the backend's own per-process limiter (M1).
    limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
    limit_req_status 429;

    upstream backend { server backend:8000; }

    # Plain HTTP only redirects to HTTPS.
    server {
        listen 80;
        listen [::]:80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        # Generated by scripts/gen-dev-certs.sh (self-signed, development). Never committed.
        ssl_certificate     /etc/nginx/certs/dev.crt;
        ssl_certificate_key /etc/nginx/certs/dev.key;

        # TLS 1.2 and 1.3 only; TLS 1.2 limited to forward-secret AEAD suites
        # (Mozilla "intermediate" profile). TLS 1.3 suites are always AEAD.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS for everything served over TLS (the backend's own copy is hidden below).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Overwrite (never append to) client-supplied forwarding headers.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-TLS-Protocol $ssl_protocol;
            proxy_hide_header Strict-Transport-Security;
            proxy_read_timeout 60s;
        }

        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-TLS-Protocol $ssl_protocol;
            proxy_hide_header Strict-Transport-Security;
        }

        # Single-page app: static build output, client-side routes fall back to index.html.
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
        }
    }
}
